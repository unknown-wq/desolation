# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: Check Build
on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          25    # Minimum
        ]
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - name: Make Gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      # The jar task depends on runDatagen, so assemble regenerates the models,
      # blockstates, tags and loot tables that src/main/generated does not track.
      - name: Build
        run: ./gradlew assemble --stacktrace
      # check runs the game tests in src/gametest against a headless server.
      - name: Game tests
        run: ./gradlew check --stacktrace
      - name: Capture build artifacts
        if: ${{ runner.os == 'Linux' && matrix.java == '25' }} # Only upload artifacts built from LTS java on one OS
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
