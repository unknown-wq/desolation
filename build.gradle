plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
	maven { url "https://maven.shedaniel.me/" }
	maven {
		name = "dblsaiko"
		url = "https://maven.dblsaiko.net/"
	}
	maven {
		name = "CurseForge"
		url = "https://minecraft.curseforge.com/api/maven"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "Ladysnake Libs"
		url = "https://maven.ladysnake.org/releases"
	}
	maven {
		name = "Gnomecraft"
		url = "https://maven.gnomecraft.net/releases"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.1+ is unobfuscated and Yarn is discontinued: no mappings line is needed.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	include(api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")) {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// GeckoLib moved to groupId com.geckolib for 26.1.2
	include(api("com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"))

	include(api("com.terraformersmc:biolith-fabric:${biolith_version}"))

	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// provision a JDK 25 toolchain instead of relying on the JDK that runs Gradle, so the
// build works on machines (and CI runners) whose default JDK is older than the release
// level required below
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
task sourcesJar(type: Jar, dependsOn: classes) {
	archiveClassifier.set("sources")
	from sourceSets.main.allSource
}

loom {
	accessWidenerPath = file("src/main/resources/desolation.accesswidener")
}

fabricApi {
	configureDataGeneration {
		client = true
	}

	// Adds the "gametest" source set plus the runGameTest task, which is wired into "check".
	configureTests {
		createSourceSet = true
		modId = "desolation-gametest"
		eula = true
	}
}

// the game tests live in their own mod but drive the main one, so they compile and run against it
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

// src/main/generated is git-ignored while Loom mounts it as a resource directory, so a clean
// clone that never ran datagen used to produce a perfectly valid jar with no models, blockstates,
// tags or loot tables inside it. runDatagen launches the game from the processed resources and so
// cannot be sequenced ahead of processResources; instead the jar depends on it and folds the
// freshly generated pack in, which also covers the very first build in a fresh clone.
jar {
	dependsOn tasks.named("runDatagen")
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	from(file("src/main/generated")) {
		exclude ".cache/**"
	}

	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(jar) {
				builtBy jar
			}
			artifact(sourcesJar) {
				builtBy sourcesJar
			}
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}
