plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
	maven { url "https://maven.shedaniel.me/" }
	maven {
		name = "dblsaiko"
		url = "https://maven.dblsaiko.net/"
	}
	maven {
		name = "CurseForge"
		url = "https://minecraft.curseforge.com/api/maven"
	}
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "Ladysnake Libs"
		url = "https://maven.ladysnake.org/releases"
	}
	maven {
		name = "Gnomecraft"
		url = "https://maven.gnomecraft.net/releases"
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Minecraft 26.1+ is unobfuscated and Yarn is discontinued: no mappings line is needed.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	include(api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}")) {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// GeckoLib moved to groupId com.geckolib for 26.1.2
	include(api("com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"))

	include(api("com.terraformersmc:biolith-fabric:${biolith_version}"))

	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// provision a JDK 25 toolchain instead of relying on the JDK that runs Gradle, so the
// build works on machines (and CI runners) whose default JDK is older than the release
// level required below
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
// if it is present.
// If you remove this task, sources will not be generated.
task sourcesJar(type: Jar, dependsOn: classes) {
	archiveClassifier.set("sources")
	from sourceSets.main.allSource
}

loom {
	accessWidenerPath = file("src/main/resources/desolation.accesswidener")
}

fabricApi {
	configureDataGeneration {
		client = true
	}

	// Adds the "gametest" source set plus the runGameTest task, which is wired into "check".
	configureTests {
		createSourceSet = true
		modId = "desolation-gametest"
		eula = true
	}
}

// the game tests live in their own mod but drive the main one, so they compile and run against it
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

// The generated pack in src/main/generated is committed rather than ignored, so it is a source
// input like any other: Loom mounts it as a resource directory of the main source set, which puts
// it in build/resources/main, which is what the jar AND every run configuration read.
//
// It has to work that way round because runDatagen cannot be sequenced ahead of processResources.
// The generator is the game itself, launched from the main runtime classpath, so runDatagen
// depends on processResources; asking processResources to wait for it in turn is a dependency
// cycle. Any arrangement that generates the pack and consumes it in the same Gradle invocation
// therefore hands the run tasks whatever build/resources/main held before the generator ran.
// Committing the output sidesteps that entirely, and CI re-runs the generators and fails on drift
// so the committed copy cannot quietly rot.
//
// If the directory is missing, say so here rather than letting the game die a hundred lines into
// a game test complaining about an unbound biome tag.
tasks.named("processResources") {
	doFirst {
		if (!file("src/main/generated/data").isDirectory()
				&& !gradle.taskGraph.allTasks.any { it.name == "runDatagen" }) {
			throw new GradleException("src/main/generated is missing. It is committed to git: " +
					"restore it with 'git checkout -- src/main/generated', or rebuild it with " +
					"'./gradlew runDatagen' before building again.")
		}
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archives_base_name}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			// add all the jars that should be included when publishing to maven
			artifact(jar) {
				builtBy jar
			}
			artifact(sourcesJar) {
				builtBy sourcesJar
			}
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}
